[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "stagehand"
dynamic = ["version"]
description = "A manager for your favourite TV series"
readme = "README.md"
license = "MIT"
license-files = ["MIT-LICENSE.txt"]
requires-python = ">=3.15"
authors = [{ name = "Jason Tackaberry", email = "tack@urandom.ca" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.12",  # DigestAuthMiddleware
    "bottle>=0.13",
]

[project.optional-dependencies]
# Browser tests of the web UI; also run `playwright install chromium`.
browser = ["playwright>=1.48"]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-aiohttp>=1.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
stagehand = "stagehand.main:main"

[project.urls]
Homepage = "https://github.com/jtackaberry/stagehand"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.sdist]
include = ["stagehand", "tests", "README.md", "CHANGELOG.md", "MIT-LICENSE.txt"]

[tool.hatch.build.targets.wheel]
packages = ["stagehand"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",  # includes unawaited coroutines and leaked files/sessions
]

[tool.coverage.run]
source = ["stagehand"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py315"
extend-exclude = ["stagehand/data"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "ASYNC",        # async pitfalls
    "RUF006",       # dangling asyncio tasks
    "SIM",          # simplifications
]
ignore = [
    "E501",    # long lines are handled by the formatter where possible
    "SIM108",  # ternaries aren't always clearer
    "B904",    # raise ... from within except: too noisy for legacy code
    "SIM105",  # try/except/pass is as clear as contextlib.suppress
    "ASYNC230", "ASYNC240",  # local file access is small and fast enough to do inline
    "UP047",   # ParamSpec-based decorators read better with explicit TypeVars
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM115", "SIM117", "UP031"]
# Ported from kaa.base; predates modern style.  Modernize opportunistically.
"stagehand/toolbox/{db,config}.py" = ["UP031", "E711", "E721", "E731", "E741", "B006", "B007", "B905", "SIM102", "SIM115", "SIM118"]
"stagehand/tvdb.py" = ["B007", "SIM102"]

[tool.ruff.format]
quote-style = "preserve"

[tool.mypy]
python_version = "3.15"
packages = ["stagehand"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Strict typing for modules that were rewritten during modernization.
[[tool.mypy.overrides]]
module = [
    "stagehand.toolbox.net",
    "stagehand.toolbox.dateutils",
    "stagehand.web.*",
    "stagehand.searchers.base",
    "stagehand.retrievers.*",
    "stagehand.notifiers.*",
    "stagehand.providers.base",
    "stagehand.media",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Legacy modules ported from kaa.base, typed only at their public surface.
# Type-checking function bodies here is mostly noise from variable reuse.
[[tool.mypy.overrides]]
module = ["stagehand.toolbox.db", "stagehand.toolbox.config", "stagehand.toolbox.inotify", "stagehand.tvdb"]
check_untyped_defs = false
